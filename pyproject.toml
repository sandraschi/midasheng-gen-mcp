[project]
name = "midasheng-gen-mcp"
version = "0.1.0"
description = "Unified audio scene generation via MiDashengLM-Gen (LLM-driven autoregressive flow matching) - speech, music, SFX, and ambience in one 16 kHz mix from text"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Sandra Schipal" }]
keywords = ["mcp", "fastmcp", "audio", "text-to-audio", "flow-matching", "midasheng"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

dependencies = [
    "fastmcp>=3.4.4,<4",
    "prefab-ui>=0.14.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Heavy inference stack - installed by start.ps1 (uv sync --extra model).
# Kept optional so CI/lint/test stay fast and the server can report a
# declared model-missing state instead of failing to import.
# NOTE: torch/torchaudio MUST come from the PyTorch CUDA index - the PyPI
# default wheel is CPU-only (torch 2.13+). See [[tool.uv.index]] below.
model = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.51",
    "einops>=0.8",
    "safetensors>=0.4",
    "soundfile>=0.12",
    "tqdm>=4.66",
    "x-transformers>=1.36",
    "huggingface_hub>=0.26",
]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/midasheng_gen_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
