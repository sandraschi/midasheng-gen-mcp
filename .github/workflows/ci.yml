name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python lint (ruff)
        run: uvx ruff check src/ tests/

      - name: Python format check
        run: uvx ruff format --check src/ tests/

      - name: Python tests (light, no torch)
        run: |
          uv sync --extra dev
          uv run pytest

      - name: Webapp dependencies (bun)
        working-directory: webapp
        run: |
          bun install --frozen-lockfile

      - name: Webapp typecheck + lint (tsc + biome)
        working-directory: webapp
        run: bun run check

      - name: Webapp production build
        working-directory: webapp
        run: bun run build
